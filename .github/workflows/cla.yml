name: Contributor agreement

# Every outside contributor agrees to CLA.md once, by commenting on their pull
# request; the signature is recorded in this repository (branch cla-signatures,
# created by infra/github-setup.sh). No external app, no personal token.
#
# pull_request_target runs with this repository's token, so this workflow never
# checks out or runs a pull request's code - it only reads comments and writes
# the signature file.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write        # the signature file on branch cla-signatures
      pull-requests: write   # the comment asking for agreement
      statuses: write        # the check the main ruleset requires
    steps:
      - name: Contributor agreement
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # v2.6.1, pinned to its commit: a tag can be moved, a commit cannot.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          # Bots do not sign. Maintainers sign once like everyone else (no account is named here).
          allowlist: dependabot[bot],github-actions[bot]
