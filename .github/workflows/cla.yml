name: Contributor agreement

# Every outside contributor agrees to CLA.md once, by commenting on their pull
# request; the signature is kept in this repository (branch cla-signatures).
# The check is our own script, .github/cla/cla.sh (tested by .github/cla/test.sh),
# not a third-party action: the one used before is archived.
#
# pull_request_target runs with this repository's token, so this workflow
# checks out the BASE branch only - never the pull request's code - and runs
# nothing from the pull request. What people type reaches the script through
# environment variables and is compared, never evaluated.
on:
  issue_comment:
    types: [created]
  pull_request_target: # zizmor: ignore[dangerous-triggers] base branch only, see above
    types: [opened, reopened, synchronize]

permissions: {}

# One run per pull request at a time: two signatures written at once would
# race for the same file.
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    # Comments on issues (not pull requests) are not our business.
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the signature file on branch cla-signatures
      pull-requests: write   # the comment that says who still has to sign
      issues: write          # (pull request comments are issue comments)
      statuses: write        # "contributor agreement", required by main's ruleset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default branch, explicitly: never the pull request's head.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/cla
      - name: Check the agreement
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENTER_ID: ${{ github.event.comment.user.id }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: bash .github/cla/cla.sh
