name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, on unchanged code: new advisories are published against
  # dependencies that were clean when they were last scanned.
  schedule:
    - cron: '17 6 * * 1'

jobs:
  agent:
    name: agent (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go vet ./...
        working-directory: agent
      - run: go test -race ./...
        working-directory: agent
      - name: govulncheck
        # go.mod pins the toolchain, so this scans the Go that production
        # binaries are actually built with. It once found six reachable
        # standard-library vulnerabilities in the deployed agent (built with
        # 1.26.3; fixed in 1.26.6+).
        working-directory: agent
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gofmt
        working-directory: agent
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

  control:
    name: control plane (laravel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # Must match the php that resolved composer.lock: Symfony 8.1
          # requires >=8.4.1 and an older runtime fails `composer install`.
          php-version: '8.4'
          extensions: mbstring, xml, curl, sqlite3, zip, intl, bcmath
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
        working-directory: control
      - run: cp .env.example .env && php artisan key:generate
        working-directory: control
      - name: composer audit
        working-directory: control
        run: composer audit --no-interaction
      - name: npm audit
        working-directory: control
        run: npm ci --no-audit --no-fund && npm audit --audit-level=high
      - name: Tests
        working-directory: control
        # PAO_DISABLE=1 is required: laravel/pao replaces the test printer when
        # it detects an AI agent and discards the whole report on a long run.
        run: PAO_DISABLE=1 php artisan test

  shell:
    name: infra scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning infra/*.sh
      - name: no code may target a server outside the fleet
        # The addresses are not in this repository (they are in the operator's
        # infra/hosts.local.env); CI gets them from the CIC_FORBIDDEN_HOSTS
        # secret and skips the check where it is not set (forks).
        #
        # A mention is allowed ONLY on a line carrying the literal marker
        # [fleet-guard-ok], which a person has to add deliberately. Matching on
        # nearby words like "forbidden" instead would let any comment through,
        # which is how the first version of this check passed on a line that
        # simply described the host.
        env:
          FORBIDDEN: ${{ secrets.CIC_FORBIDDEN_HOSTS }}
        run: |
          if [ -z "$FORBIDDEN" ]; then echo "no CIC_FORBIDDEN_HOSTS secret: skipped"; exit 0; fi
          found=0
          for ip in $FORBIDDEN; do
            if grep -rnF "$ip" --include='*.sh' --include='*.php' --include='*.go' --include='*.js' . \
               | grep -v '\[fleet-guard-ok\]'; then found=1; fi
          done
          if [ "$found" = 1 ]; then
            echo
            echo "A server outside the fleet is referenced without a [fleet-guard-ok] marker."
            exit 1
          fi
          echo "clean"
